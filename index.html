<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet" />
    <title>Event-Horizon</title>
</head>

<body>

    <div class="flex w-full h-screen bg-black">

        <section
            class="py-6 px-3 flex flex-col w-25 border-r border-zinc-800 bg-zinc-900/50 shadow-2xl z-10">
            <div class="mb-6">
                <img src="assets/logo.png" alt="logo">
            </div>

            <nav>
                <div class="space-y-7">
                    <button id="movement"
                        class="flex justify-center w-full text-lg font-medium text-gray-950 dark:text-white  border border-zinc-100 rounded-xl bg-zinc-800 hover:bg-zinc-700 transition-all">
                    </button>
                    <span id="zoomOut"
                        class="flex justify-center w-full text-lg font-medium text-gray-950 dark:text-white  border border-zinc-100 rounded-xl bg-zinc-800 hover:bg-zinc-700 transition-all">
                        &#128228;
                </span>
                </div>
            </nav>

        </section>

        <nav class="absolute top-6 right-3 z-50">
            <a href="apropos.html" class="px-5 py-2 text-sm font-medium text-zinc-100 hover:text-white border border-zinc-700 rounded-full  bg-zinc-900/50 hover:bg-zinc-800/80 backdrop-blur-md transition-all shadow-lg">
                À propos
            </a>
        </nav>

        <main id="globe" class="flex-1 w-full h-full active:cursor-grabbing"></main>
    </div>

    <script type="module" src="main.js"></script>

</html>
