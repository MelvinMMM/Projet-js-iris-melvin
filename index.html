<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet" />
    <title>Event-Horizon</title>
  </head>
  <body>
    <div id="loading" class="m-auto w-full h-full flex flex-col items-center fixed z-100 transition-opacity duration-1000 ease-in-out justify-center bg-black px-4">
      <img src="assets/ellipsisLoading.svg" alt="loading" class="object-contain w-20 sm:w-28 md:w-32 lg:w-48" />
    </div>
    <div class="flex h-dvh w-full bg-transparent relative min-h-screen">
      <section class="absolute w-14 sm:w-14 md:w-14 lg:w-24 h-full py-5 md:py-6 px-3 md:px-4 flex flex-col z-10 items-center justify-between">
        <div class="mb-6">
          <img src="assets/icons8-geographie-30.png" alt="logo" />
        </div>
        <div class="absolute bottom-4 left-50 md:left-1/2 -translate-x-1/2 flex flex-row md:flex-col items-center justify-center gap-2">
          <div>
            <button
              id="movement"
              class="w-full flex font-medium text-gray-950 dark:text-white justify-center bg-zinc-800/40 hover:bg-zinc-700/55 border border-zinc-100 rounded-full transition-all text-xs p-2 mb-2 cursor-pointer backdrop-blur-sm"
              aria-label="Toggle globe rotation"
            ></button>
          </div>
          <div>
            <button
              id="zoomOut"
              class="w-full flex font-medium text-gray-950 dark:text-white justify-center bg-zinc-800/40 backdrop-blur-sm hover:bg-zinc-700/55 border border-zinc-100 rounded-full transition-all text-xs p-2 mb-2 cursor-pointer"
              aria-label="Zoom out"
            >
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15m-3 0-3-3m0 0 3-3m-3 3H15"
                />
              </svg>
            </button>
          </div>
        </div>
      </section>

      <div class="absolute top-4 left-14 sm:left-24 md:left-30 right-4 z-10 flex flex-row gap-2 sm:gap-3 items-start">
        <div class="w-40 sm:w-44 md:w-52 shrink-0 bg-white/10 backdrop-blur-md border border-zinc-700/80 shadow-2xl text-gray-50 rounded-2xl transition-colors duration-200">
          <details class="group p-2 rounded-full cursor-pointer text-zinc-300">
            <summary class="flex justify-between items-center text-sm font-medium cursor-pointer list-none">
              <span data-i18n="filters">Filters</span>
              <span class="transition-transform duration-300 group-open:rotate-180 text-zinc-300">
                <svg fill="none" height="20" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="20">
                  <path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
              </span>
            </summary>

            <div class="mt-3 pt-3 border-t border-zinc-700/70">
              <h3 class="text-xs font-medium text-zinc-400 uppercase tracking-widest mb-3" data-i18n="category">Category</h3>
              <div id="filters-container" class="space-y-2 text-sm text-zinc-100">
                <div class="flex items-center gap-2">
                  <input type="checkbox" id="wildfires" name="wildfires" value="Wildfires" checked class="accent-[#ff4500] check w-4 h-4 cursor-pointer" />
                  <label for="wildfires" class="cursor-pointer select-none">Wildfires</label>
                </div>
                <div class="flex items-center gap-2">
                  <input type="checkbox" id="volcanoes" name="volcanoes" value="Volcanoes" checked class="accent-[#ff00ff] check w-4 h-4 cursor-pointer" />
                  <label for="volcanoes" class="cursor-pointer select-none">Volcanoes</label>
                </div>
                <div class="flex items-center gap-2">
                  <input type="checkbox" id="severeStorms" name="severe-storms" value="Severe Storms" checked class="accent-[#f0f0f0] check w-4 h-4 cursor-pointer" />
                  <label for="severeStorms" class="cursor-pointer select-none">Severe Storms</label>
                </div>
                <div class="flex items-center gap-2">
                  <input type="checkbox" id="seaLakeIce" name="seaLakeIce" value="Sea/Lake Ice" checked class="accent-[#1e90ff] check w-4 h-4 cursor-pointer" />
                  <label for="seaLakeIce" class="cursor-pointer select-none">Sea/Lake Ice</label>
                </div>
                <div class="flex items-center gap-2">
                  <input type="checkbox" id="earthquakes" name="earthquakes" value="Earthquakes" checked class="accent-[#ffd700] check w-4 h-4 cursor-pointer" />
                  <label for="earthquakes" class="cursor-pointer select-none">Earthquakes</label>
                </div>
                <div class="flex items-center gap-2">
                  <input type="checkbox" id="floods" name="floods" value="Floods" checked class="accent-[#00ffff] check w-4 h-4 cursor-pointer" />
                  <label for="floods" class="cursor-pointer select-none">Floods</label>
                </div>
              </div>
            </div>
          </details>
        </div>

        <div class="relative flex-1 min-w-1 md:min-w-0 md:max-w-sm">
            <form class="w-full">
            <label for="Search" class="block mb-2.5 text-sm font-medium text-heading sr-only">Search</label>
            <div class="relative">
              <div class="absolute inset-y-0 inset-s-0 flex items-center ps-3 pointer-events-none">
              <svg
                class="w-4 h-4 text-white pointer-events-none absolute z-99"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                fill="none"
                viewBox="0 0 24 24"
              >
                <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
              </svg>
              </div>
              <input
              type="search"
              id="search"
              class="block w-full p-2 ps-9 bg-white/10 backdrop-blur-sm border border-zinc-700/80 shadow-2xl text-white text-sm rounded-2xl transition-colors duration-200 placeholder:text-white focus:bg-zinc-800/95 focus:border-white/70 focus:ring-2 focus:ring-white/35 focus:outline-none"
              placeholder="Search"
              required
              />
            </div>
            </form>
          <ul id="searchResults" class="hidden absolute top-full left-0 w-full mt-2 bg-zinc-900/90 border border-zinc-700 rounded-xl max-h-60 overflow-y-auto z-20 shadow-2xl text-gray-50"></ul>
        </div>
      </div>

      <div
        id="countryInfoCard"
        class="absolute z-10 top-20 md:top-4 right-4 bg-zinc-900/90 backdrop-blur-md border border-zinc-700 rounded-2xl shadow-2xl text-gray-50 w-[calc(100%-7rem)] md:w-64 p-3 md:p-4 transition-opacity duration-300 opacity-0 pointer-events-none"
      >
        <div class="flex items-center gap-3 mb-3 border-b border-zinc-700 pb-2">
          <img id="countryFlag" src="" alt="Flag" class="w-10 h-auto rounded-sm shadow-md hidden" />
          <h2 id="countryName" class="text-lg font-bold leading-tight" data-i18n="hoverCountry">Hover over a country</h2>
        </div>

        <div class="space-y-2 text-sm text-zinc-400">
          <p class="flex justify-between">
            <span data-i18n="localTime">🕒 Local time</span>
            <span id="countryTime" class="text-white font-medium">...</span>
          </p>
          <p class="flex justify-between">
            <span data-i18n="languages">🗣️ Languages</span>
            <span id="countryLang" class="text-white font-medium text-right truncate w-32">...</span>
          </p>
          <p class="flex justify-between">
            <span data-i18n="population">👥 Population</span>
            <span id="countryPop" class="text-white font-medium">...</span>
          </p>
        </div>
      </div>
      <div id="location-info-box" class="location-info-box w-full md:w-64 absolute top-4 left-1/2 -translate-x-1/2 p-4 pointer-events-none">
        <h1>Informations sur l'emplacement</h1>
      </div>

      <main id="globe" class="w-full flex-1 h-full min-h-dvh active:cursor-grabbing"></main>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
