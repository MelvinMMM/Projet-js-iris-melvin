<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet" />
    <title>Event-Horizon</title>
</head>

<body>

    <div class="flex h-screen w-full bg-black">

        <section
            class="w-25 bg-zinc-900/50 border-r border-zinc-800 py-6 px-3 flex flex-col z-10 shadow-2xl">
            <div class="mb-6">
                <img src="assets/logo.png" alt="logo">
            </div>

            <nav>
                <div class="space-y-7">
                    <button id="movement"
                        class="w-full flex font-medium text-gray-950 dark:text-white justify-center bg-zinc-800 hover:bg-zinc-700 border border-zinc-100 rounded-xl transition-all text-lg">
                    </button>
                    <span id="zoomOut"
                        class="w-full flex font-medium text-gray-950 dark:text-white justify-center bg-zinc-800 hover:bg-zinc-700 border border-zinc-100 rounded-xl transition-all text-lg">
                        &#128228;
                </span>
                </div>
            </nav>

        </section>

        <main id="globe" class="w-full flex-1 h-full active:cursor-grabbing"></main>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
