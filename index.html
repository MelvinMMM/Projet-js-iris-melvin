<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet" />
    <title>Event-Horizon</title>
</head>

<body>

    <div class="flex h-screen w-full bg-black">
        <section class="w-25 bg-zinc-900/50 border-r border-zinc-800 py-6 px-3 flex flex-col z-10 shadow-2xl">
            <div class="mb-6">
                <img src="assets/logo.png" alt="logo">
            </div>

            <nav>
                <div class="space-y-7">
                    <button id="movement"
                        class="w-full flex font-medium text-gray-950 dark:text-white justify-center bg-zinc-800 hover:bg-zinc-700 border border-zinc-100 rounded-xl transition-all text-lg">
                    </button>
                    <span id="zoomOut"
                        class="w-full flex font-medium text-gray-950 dark:text-white justify-center bg-zinc-800 hover:bg-zinc-700 border border-zinc-100 rounded-xl transition-all text-lg">
                        &#128228;
                    </span>
                </div>
            </nav>
        </section>
        <!-- Card filtre flottante au-dessus du globe -->
        <div
            class="absolute top-4 left-30 z-10 bg-zinc-900/80 backdrop-blur-sm border border-zinc-700 rounded-2xl shadow-2xl text-gray-50 w-52 transition-all">
            <details class="group p-5">
                <summary class="flex justify-between items-center text-xl font-semibold cursor-pointer list-none">
                    Filters
                    <span class="transition-transform duration-300 group-open:rotate-180">
                        <svg fill="none" height="20" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
                            width="20">
                            <path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </span>
                </summary>

                <div class="mt-4 pt-4 border-t border-zinc-700/50">
                    <h3 class="text-sm font-medium text-zinc-400 uppercase tracking-widest mb-3">Category</h3>
                    <div id="filters-container" class="space-y-2 text-base">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="wildfires" name="wildfires" value="Wildfires" checked
                                class="accent-[#ff4500] check w-4 h-4 cursor-pointer" />
                            <label for="wildfires" class="cursor-pointer select-none">Wildfires</label>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="volcanoes" name="volcanoes" value="Volcanoes" checked
                                class="accent-[#ff00ff] check w-4 h-4 cursor-pointer" />
                            <label for="volcanoes" class="cursor-pointer select-none">Volcanoes</label>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="severeStorms" name="severe-storms" value="Severe Storms" checked
                                class="accent-[#f0f0f0] check w-4 h-4 cursor-pointer" />
                            <label for="severeStorms" class="cursor-pointer select-none">Severe Storms</label>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="seaLakeIce" name="seaLakeIce" value="Sea/Lake Ice" checked
                                class="accent-[#1e90ff] check w-4 h-4 cursor-pointer" />
                            <label for="seaLakeIce" class="cursor-pointer select-none">Sea/Lake Ice</label>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="earthquakes" name="earthquakes" value="Earthquakes" checked
                                class="accent-[#ffd700] check w-4 h-4 cursor-pointer" />
                            <label for="earthquakes" class="cursor-pointer select-none">Earthquakes</label>
                        </div>
                    </div>
                </div>
            </details>
        </div>
        <main id="globe" class="w-full flex-1 h-full active:cursor-grabbing"></main>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
